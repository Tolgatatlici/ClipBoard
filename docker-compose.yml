# Lokal geliştirme için yardımcı servisler: `pnpm services:up`
services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # S3 uyumlu depolama (STORAGE_DRIVER=s3 ile denemek için). Kimlik bilgileri
  # deploy/seaweedfs/s3.json dosyasında; imzasız istekler reddedilir.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - '8333:8333'
    volumes:
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data

  # Bucket'ı oluşturur.
  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on: [s3]
    restart: on-failure
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'sleep 3 && echo "s3.bucket.create -name clipboard-files" | weed shell -master=s3:9333'

volumes:
  s3-data:
