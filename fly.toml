# Fly.io yapılandırması. Kurulum:
#   fly launch --no-deploy --copy-config
#   fly redis create                      # Upstash Redis; çıkan adresi REDIS_URL yapın
#   fly secrets set REDIS_URL=... STORAGE_DRIVER=s3 S3_ENDPOINT=... S3_BUCKET=... \
#       S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=... CORS_ORIGIN=https://<alan-adı>
#   fly deploy
# Birden fazla makinede dosyalar paylaşılmalı; bu yüzden Fly'da `s3` sürücüsü önerilir.
app = 'clipboard'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  TRUST_PROXY = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
